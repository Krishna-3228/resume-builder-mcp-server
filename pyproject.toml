[project]
name = "resume-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krishna-3228", email = "tiksgupta20@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.10",
    "pyyaml>=6.0.3",
]

[project.scripts]
resume-mcp = "resume_mcp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]